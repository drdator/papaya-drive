<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d9e5db" />
    <title>Motion test · Papaya Drive</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #d9e5db;
        color: #254d40;
        font:
          16px system-ui,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      header,
      footer {
        position: fixed;
        left: 0;
        right: 0;
        padding: 20px;
        text-align: center;
        pointer-events: none;
      }
      header {
        top: 0;
        padding-top: max(20px, env(safe-area-inset-top));
      }
      footer {
        bottom: 0;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 14px;
      }
      button,
      a {
        pointer-events: auto;
        color: inherit;
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        min-height: 48px;
        padding: 10px 20px;
        border: 2px solid #254d40;
        border-radius: 14px;
        background: #fff5d9;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #e99451;
      }
      a {
        display: inline-block;
        padding: 12px;
      }
      output {
        display: block;
        margin-top: 14px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main id="view"></main>
    <header>
      <h1>Motion test</h1>
      <p>Drag to look around the cube.</p>
      <button id="spin" type="button" aria-pressed="false">Auto rotate</button>
    </header>
    <footer>
      <a href="./?stats=1">Back to game</a>
      <output id="stats">Measuring frame timing…</output>
    </footer>
    <script type="module" src="/app/motion-test.ts"></script>
  </body>
</html>
